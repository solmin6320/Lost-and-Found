spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/lostfound
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 60MB

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 300000       # 5분(ms)
  refresh-token-expiration: 604800000   # 7일(ms)

cloud:
  aws:
    region: ap-northeast-2   # 로컬, 운영 동일하므로 기본 파일에 둠