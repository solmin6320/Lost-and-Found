# 자동 배포(CD)
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  deploy:
    name: EC2 배포

    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{vars.SITE_URL}}

    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC 토큰 요청
    env:
      DEPLOY_SHA: ${{github.event.workflow_run.head_sha}}

      AWS_REGION: ap-northeast-2
      AWS_PAGER: ''

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref:  ${{env.DEPLOY_SHA}}
          persist-credentials: false

      - name: AWS 역할 받기(OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{vars.AWS_DEPLOY_ROLE_ARN}}
          aws-region: ap-northeast-2
          role-session-name: lostfound-backend-deploy-${{github.run_id}}
          role-duration-seconds: 1800

      - name: 이미지 빌드, ECR 푸시
        run: |
          TAG="${DEPLOY_SHA:0:7}"
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          IMAGE="$ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com/lostfound-api"
          aws ecr get-login-password | docker login --username AWS --password-stdin "${IMAGE%%/*}"
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: EC2 배포(SSM)
        env:
          INSTANCE_ID: ${{vars.EC2_INSTANCE_ID}}
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $TAG" \
            --parameters "{\"commands\":[\"/opt/lostfound/deploy.sh $TAG\"]}" \
            --query Command.CommandId --output text)
          echo "명령 ID: $CMD_ID"
          STATUS=Pending
          for i in $(seq 1 90); do
          sleep 5
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
          case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "결과: $STATUS"
          [ "$STATUS" = "Success" ]

      - name: 사이트로 확인(사용자와 같은 길)
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 15 "${SITE_URL%/}/api/posts?size=1" | grep -q '"content"'; then
              echo "사이트의 /api 응답 정상"
              exit 0
            fi
            sleep 5
          done
          echo "::error::배포 뒤 사이트의 /api 가 응답하지 않습니다"
          exit 1
