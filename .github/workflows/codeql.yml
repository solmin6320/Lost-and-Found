# .github/workflows/codeql.yml
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 18 * * 0'   # 매주 일요일 03:00

jobs:
  analyze:
    name: 보안 취약점 분석
    runs-on: ubuntu-latest

    # 분석 결과를 Security 탭에 올리기 위해 필요
    permissions:
      security-events: write
      contents: read

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Gradle 실행 권한 부여
        run: chmod +x ./gradlew

      - name: CodeQL 초기화
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin

      - name: 자동 빌드
        uses: github/codeql-action/autobuild@v3

      - name: CodeQL 분석
        uses: github/codeql-action/analyze@v3